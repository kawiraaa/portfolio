<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <script>
    const CONFIG = {
      name: "Hi, 
        I'm Colleen.",
      title: "Data Analyst",
      description: "I turn raw data into clear insights that help support smarter decisions and business growth.",
      accentColor: "#00C896",

      social: {
        email: "colleenkawira@gmail.com",
        linkedin: "https://www.linkedin.com/in/colleen-patience-k-641a84337/",
        github: "https://github.com/kawiraaa",
      },

      aboutMe: "I am a data analyst passionate about turning raw data into meaningful insights that support better decision-making. I work with data cleaning, analysis, and visualization to identify patterns, trends, and actionable insights. I enjoy using tools like Python, SQL, and Excel to solve real-world problems and communicate findings clearly through reports and dashboards.",

      skills: [
        "SQL", "Python", "Excel", "Looker Studio"
      ],

      projects: [
        {
          name: "tuberculosis treatment outcome analysis.",
          description: "This project analyzes tuberculosis patient data using SQL and dashboards to identify key factors affecting treatment outcomes and improve patient care decisions."

          link: "https://github.com/kawiraaa/tb-analysis",
          skills: ["SQL", "Looker Studio"]
        },
        {
          name: "Better Health Pharmacy Sales Analysis",
          description: "This project analyzes Q4 2025 sales data for Better Health Pharmacy to identify key trends in revenue, product performance, and customer behavior. It uses SQL, Python and Looker Studio to transform raw sales data into actionable business insights for better decision-making.",
          link: "https://github.com/kawiraaa/pharma-sales",
          skills: ["Python", "SQL", "Looker Studio"]
        },
        {
          name: "Telehealth Patient Experience Analysis",
          description: "An analysis of telehealth patient experience data to identify key drivers of satisfaction and provide recommendations for improving service efficiency and scalability.",
          link: "https://github.com/kawiraaa/telehealth-",
          skills: ["Excel"]
        }
      ]
    };
  </script>
  <!-- ══════════ END CONFIG ══════════ -->

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #00C896;
      --bg: #0d0d0d;
      --bg2: #141414;
      --bg3: #1c1c1c;
      --border: rgba(255,255,255,0.07);
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.45);
      --font-display: 'DM Serif Display', serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.1rem 2.5rem;
      background: rgba(13,13,13,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.06em;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a {
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }

    #hero {
      min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 8rem 2.5rem 4rem;
      max-width: 900px; margin: 0 auto;
      position: relative;
    }
    .hero-tag {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 1.25rem;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }
    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--text);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.1s forwards;
    }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-style: italic;
      color: var(--muted);
      line-height: 1.2;
      margin-top: 0.4rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.2s forwards;
    }
    .hero-desc {
      max-width: 520px;
      margin-top: 1.75rem;
      font-size: 1rem;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.6s ease 0.3s forwards;
    }
    .hero-social {
      display: flex; gap: 1rem; align-items: center;
      margin-top: 2.25rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.4s forwards;
    }
    .social-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--muted);
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .social-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,200,150,0.05);
    }
    .social-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .scroll-hint {
      margin-top: 4rem;
      display: flex; align-items: center; gap: 0.75rem;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.6s forwards;
    }
    .scroll-line { width: 48px; height: 1px; background: var(--accent); opacity: 0.5; }
    .scroll-hint span {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    section {
      max-width: 900px;
      margin: 0 auto;
      padding: 5rem 2.5rem;
    }
    .section-label {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .section-label-num {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.08em;
    }
    .section-label-text {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      color: var(--text);
    }
    .section-divider { flex: 1; height: 1px; background: var(--border); }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: start;
    }
    .about-text { font-size: 1rem; color: var(--muted); }
    .about-text p { margin-bottom: 1rem; }

    .skills-title {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    .skills-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .skill-tag {
      padding: 0.35rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s;
      cursor: default;
    }
    .skill-tag:hover { border-color: var(--accent); color: var(--accent); }

    .projects-list { display: flex; flex-direction: column; gap: 1.5rem; }
    .project-card {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1.25rem;
      padding: 1.75rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      transition: border-color 0.25s, background 0.25s;
    }
    .project-card:hover { border-color: var(--accent); background: var(--bg3); }
    .project-num {
      font-family: var(--font-display);
      font-size: 3rem;
      font-style: italic;
      color: var(--border);
      line-height: 1;
      margin-top: 0.25rem;
      transition: color 0.25s;
      user-select: none;
    }
    .project-card:hover .project-num { color: var(--accent); opacity: 0.3; }
    .project-name {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--text);
      margin-bottom: 0.5rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .project-name svg {
      width: 14px; height: 14px;
      stroke: var(--accent); fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      opacity: 0; transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .project-card:hover .project-name svg { opacity: 1; }
    .project-desc { font-size: 0.9rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.65; }
    .project-skills { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .project-skill {
      padding: 0.2rem 0.65rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 2px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }

    footer {
      text-align: center;
      padding: 3rem 2rem;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }
    footer span { color: var(--accent); }

    .grid-overlay {
      pointer-events: none;
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 0%, transparent 100%);
      opacity: 0.5;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .reveal {
      opacity: 0; transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 640px) {
      nav { padding: 1rem 1.25rem; }
      .nav-links { gap: 1.25rem; }
      #hero, section { padding-left: 1.25rem; padding-right: 1.25rem; }
      .about-grid { grid-template-columns: 1fr; }
      .project-card { grid-template-columns: 1fr; }
      .project-num { display: none; }
    }
  </style>
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>

  <nav id="navbar">
    <a class="nav-logo" href="#hero" id="nav-logo">CK</a>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
    </ul>
  </nav>

  <div id="hero">
    <p class="hero-tag">// hello world</p>
    <h1 class="hero-name" id="hero-name"></h1>
    <p class="hero-title" id="hero-title"></p>
    <p class="hero-desc" id="hero-desc"></p>
    <div class="hero-social" id="hero-social"></div>
    <div class="scroll-hint">
      <div class="scroll-line"></div>
      <span>scroll to explore</span>
    </div>
  </div>

  <section id="about">
    <div class="section-label reveal">
      <span class="section-label-num">01</span>
      <h2 class="section-label-text">About Me</h2>
      <div class="section-divider"></div>
    </div>
    <div class="about-grid reveal">
      <div class="about-text" id="about-text"></div>
      <div>
        <p class="skills-title">// skills &amp; technologies</p>
        <div class="skills-list" id="skills-list"></div>
      </div>
    </div>
  </section>

  <section id="projects">
    <div class="section-label reveal">
      <span class="section-label-num">02</span>
      <h2 class="section-label-text">Projects</h2>
      <div class="section-divider"></div>
    </div>
    <div class="projects-list" id="projects-list"></div>
  </section>

  <footer id="footer"></footer>

  <script>
    document.documentElement.style.setProperty('--accent', CONFIG.accentColor);
    document.title = CONFIG.name + ' - ' + CONFIG.title;
    document.getElementById('hero-name').textContent = CONFIG.name;
    document.getElementById('hero-title').textContent = CONFIG.title;
    document.getElementById('hero-desc').textContent = CONFIG.description;

    var icons = {
      email: '<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/></svg>',
      linkedin: '<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 10v7M7 7v.01M11 17v-4a2 2 0 014 0v4M11 10v7"/></svg>',
      github: '<svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>'
    };

    var social = CONFIG.social;
    var socialEl = document.getElementById('hero-social');

    if (social.email) {
      var emailLink = 'https://mail.google.com/mail/?view=cm&to=' + social.email;
      socialEl.innerHTML += '<a class="social-btn" href="' + emailLink + '" target="_blank" rel="noopener">' + icons.email + ' Email</a>';
    }
    if (social.linkedin) {
      socialEl.innerHTML += '<a class="social-btn" href="' + social.linkedin + '" target="_blank" rel="noopener">' + icons.linkedin + ' LinkedIn</a>';
    }
    if (social.github) {
      socialEl.innerHTML += '<a class="social-btn" href="' + social.github + '" target="_blank" rel="noopener">' + icons.github + ' GitHub</a>';
    }

    var aboutEl = document.getElementById('about-text');
    var p = document.createElement('p');
    p.textContent = CONFIG.aboutMe;
    aboutEl.appendChild(p);

    var skillsEl = document.getElementById('skills-list');
    CONFIG.skills.forEach(function(skill) {
      var span = document.createElement('span');
      span.className = 'skill-tag';
      span.textContent = skill;
      skillsEl.appendChild(span);
    });

    var projectsEl = document.getElementById('projects-list');
    CONFIG.projects.forEach(function(project, i) {
      var num = String(i + 1).padStart(2, '0');
      var card = document.createElement('a');
      card.className = 'project-card reveal';
      card.href = project.link;
      card.target = '_blank';
      card.rel = 'noopener';
      var skillTags = project.skills.map(function(s) {
        return '<span class="project-skill">' + s + '</span>';
      }).join('');
      card.innerHTML =
        '<div class="project-num">' + num + '</div>' +
        '<div>' +
          '<p class="project-name">' + project.name +
            '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
          '</p>' +
          '<p class="project-desc">' + project.description + '</p>' +
          '<div class="project-skills">' + skillTags + '</div>' +
        '</div>';
      projectsEl.appendChild(card);
    });

    document.getElementById('footer').innerHTML =
      '<p>Designed &amp; built by <span>' + CONFIG.name + '</span> &mdash; ' + new Date().getFullYear() + '</p>';

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });

    window.addEventListener('scroll', function() {
      var nav = document.getElementById('navbar');
      nav.style.padding = window.scrollY > 50 ? '0.65rem 2.5rem' : '1.1rem 2.5rem';
    });
  </script>
</body>
</html>
